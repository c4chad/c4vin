erto Rico and Virgin Islands", "VC5": "Shipping label, except US, US possessions or Japan", "VC7": "Price/fuel economy label, Guam", "VD1": "European option provisions", "VE1": "Japanese option provisions", "VE2": "Applied protector", "VG1": "Underhood corrosion protector", "VG6": "Bumper impact information label, California", "VG8": "Vehicle label, notice to buyer", "VG9": "Protector wax, exterior body", "VH3": "Bumper impact information label, Hawaii", "VH5": "Vehicle identification plate", "VJ9": "California compliance emission label", "VK3": "Front license plate mounting package", "VL2": "Compact spare wheel caution label", "VL4": "Front license plate mounting package", "VL5": "Rear license plate mounting package", "VL6": "Front license plate mounting package for Japan", "VL7": "Information label front and rear bumper impact, New York", "VM3": "Information consumer label, bumper impact standards", "VO1": "Heavy duty radiator", "VQ8": "Fleet program, guaranteed partial repurchase", "VS7": "Non‑saleable vehicle", "VX7": "Fleet program, cash on delivery, daily rental", "W82": "Motor Trend Car of Year Decal", "W92": "Direct sale", "WD0": "Start of platform", "WD1": "Pilot vehicle", "WD2": "Prototype vehicle", "WDV": "Partial deductible warranty waiver", "WT9": "Order modification for domestic delivery", "WY5": "Performance package, extended mobility tires (EMT)", "X05": "Sales processing option 14", "XAA": "Front tire P255/45 ZR17", "XAU": "Front tire P275/40 ZR17", "XCI": "Front tire P255/45 ZR17", "XFR": "Front tire P255/45 ZR17, EMT", "XJ5": "Special equipment for Sweden", "Y6X": "Pre‑order evaluation test", "YAA": "Rear tire P285/40 ZR17", "YAU": "Rear tire P275/40 ZR17", "YBE": "Rear tire P315/35 ZR17", "YCI": "Rear tire 255/45 ZR17", "YE8": "Corvette engineering department test vehicle", "YF5": "California emissions package", "YFR": "EMT rear tire P255/45 ZR17", "YFS": "EMT rear tire P285/40 ZR17", "Z01": "35th anniversary package", "Z07": "Adjustable performance handling package", "Z15": "Collector edition appearance package", "Z16": "Grand Sport appearance package", "Z25": "40th anniversary appearance package", "Z31": "Advance price sheet", "Z49": "Mandatory Canadian base equipment modifications", "Z4Z": "Indy pace car replica", "Z51": "Performance handling package", "Z52": "Sport handling package", "Z6A": "Rear window and side mirror defoggers", "ZR1": "Special performance package", "ZR6": "GM show vehicle", "ZV1": "Manufacturers statement of origin"
        };
        const allRpoCodes = Object.keys(rpoData).sort();
        
        // Data for MSRP pricing
        const rpoPrices = {
            "Z51": 575,
            "LT1": 0, // This is a standard engine, no added cost.
            "F45": 1695,
            "AC1": 240,
            "AC3": 240,
            "AQ9": 1025,
            "AR9": 400,
            "B2K": 25895,
            "B4P": 75,
            "CC2": 1995,
            "C2L": 915,
            "24S": 915,
            "64S": 615,
            "C68": 150,
            "D74": 58,
            "FX3": 1695,
            "G92": 22,
            "K05": 20,
            "KC4": 110,
            "NN5": 100,
            "UJ6": 325,
            "UU8": 773,
            "V01": 40,
            "V56": 140,
        };

        // DOM Elements
        const vinInput = document.getElementById('vin-input');
        const vinError = document.getElementById('vin-error');
        const rpoInput = document.getElementById('rpo-input');
        const rpoOptionsList = document.getElementById('rpo-options-list');
        const rpoChipsContainer = document.getElementById('rpo-chips-container');
        const decodeBtn = document.getElementById('decode-btn');
        const resultsContainer = document.getElementById('results-container');
        const vinResultsDiv = document.getElementById('vin-results');
        const rpoResultsUl = document.getElementById('rpo-results');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const copyRpoBtn = document.getElementById('copy-rpo-btn');
        const msrpBanner = document.getElementById('msrp-banner');
        const msrpValue = document.getElementById('msrp-value');

        // State variables
        let selectedRpos = new Set();
        let vinBreakdown = {};
        let rpoBreakdown = {};

        // --- RPO Multi-select Logic ---
        function populateRpoOptions(codes) {
            rpoOptionsList.innerHTML = '';
            if (codes.length === 0) {
                const li = document.createElement('div');
                li.className = 'p-2 text-gray-400 text-sm';
                li.textContent = 'No matching RPO codes.';
                rpoOptionsList.appendChild(li);
                return;
            }
            codes.forEach(code => {
                if (!selectedRpos.has(code)) {
                    const option = document.createElement('div');
                    option.textContent = `${code} - ${rpoData[code]}`;
                    option.className = 'p-2 hover:bg-gray-700 cursor-pointer text-sm';
                    option.dataset.code = code;
                    rpoOptionsList.appendChild(option);
                }
            });
        }

        function addRpoChip(code) {
            if (!selectedRpos.has(code)) {
                selectedRpos.add(code);
                const chip = document.createElement('span');
                chip.className = 'chip px-2 py-1 rounded-full text-sm mr-2 mb-2 flex items-center';
                chip.dataset.code = code;
                chip.textContent = code;

                const removeBtn = document.createElement('span');
                removeBtn.className = 'chip-remove ml-2 cursor-pointer font-bold';
                removeBtn.innerHTML = '&times';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChip(chip);
                };
                chip.appendChild(removeBtn);
                rpoChipsContainer.insertBefore(chip, rpoInput);
                rpoInput.value = '';
                rpoOptionsList.classList.remove('hidden'); // Keep the list open
                populateRpoOptions(allRpoCodes.filter(c => !selectedRpos.has(c)));
            }
        }
        
        function deleteChip(chip) {
            if (chip) {
                const code = chip.dataset.code;
                selectedRpos.delete(code);
                chip.remove();
                rpoInput.focus();
                populateRpoOptions(allRpoCodes.filter(c => !selectedRpos.has(c)));
            }
        }

        // Handle input events for searching and pasting
        rpoInput.addEventListener('input', (e) => {
            const query = e.target.value;
            // Handle paste of comma-separated list
            if (query.includes(',')) {
                const codes = query.split(',').map(c => c.trim().toUpperCase()).filter(c => rpoData[c]);
                codes.forEach(addRpoChip);
                rpoInput.value = ''; // Clear input after processing
            } else {
                const filteredCodes = allRpoCodes.filter(code =>
                    code.includes(query.toUpperCase()) && !selectedRpos.has(code)
                );
                populateRpoOptions(filteredCodes);
            }
        });

        rpoInput.addEventListener('keydown', (e) => {
            // Check if backspace is pressed and input is empty
            if (e.key === 'Backspace' && rpoInput.value === '') {
                const lastChip = rpoChipsContainer.querySelector('.chip:last-of-type');
                deleteChip(lastChip);
            }
        });

        // Toggle the options list on focus and blur
        rpoInput.addEventListener('focus', () => {
            rpoOptionsList.classList.remove('hidden');
            populateRpoOptions(allRpoCodes.filter(c => !selectedRpos.has(c)));
        });

        // Hide options list when clicking outside
        document.addEventListener('click', (e) => {
            if (!rpoChipsContainer.contains(e.target) && !rpoOptionsList.contains(e.target)) {
                rpoOptionsList.classList.add('hidden');
            }
        });

        rpoOptionsList.addEventListener('click', (e) => {
            const code = e.target.dataset.code;
            if (code) {
                addRpoChip(code);
            }
        });
        
        // Ensure input field receives focus when clicking the container
        rpoChipsContainer.addEventListener('click', (e) => {
            if (e.target.id === 'rpo-chips-container') {
                rpoInput.focus();
            }
        });

        // --- Decoding & Display Logic ---
        decodeBtn.addEventListener('click', () => {
            const vin = vinInput.value.toUpperCase();
            if (vin.length !== 17) {
                vinError.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                msrpBanner.classList.add('hidden');
                return;
            }
            vinError.classList.add('hidden');
            
            // Clear previous results
            vinResultsDiv.innerHTML = '';
            rpoResultsUl.innerHTML = '';
            vinBreakdown = {};
            rpoBreakdown = {};

            // Decode VIN
            decodeVin(vin);
            
            // Decode RPO codes
            decodeRpos();

            // Calculate and display MSRP
            calculateMSRP();

            // Display results
            resultsContainer.classList.remove('hidden');
            msrpBanner.classList.remove('hidden');
        });

        function decodeVin(vin) {
            const vinOrder = ['10', '2', '3', '4', '5', '6', '8', '1', '11', '7', '12-17'];
            const addResult = (desc, value) => {
                const item = document.createElement('div');
                item.className = 'p-4 bg-black rounded-md shadow-inner transition-all hover:bg-neutral-800';
                item.innerHTML = `<span class="font-normal text-secondary">${desc}:</span> <strong class="text-primary">${value}</strong>`;
                vinResultsDiv.appendChild(item);
                vinBreakdown[desc] = value;
            };

            vinOrder.forEach(key => {
                let value = 'Unknown';
                let description = vinData[key].description;
                if (key === '12-17') {
                    const seq = vin.substring(11, 17);
                    value = vinData[key].values['100001'];
                    if (vinData[key].values[seq]) {
                        value = vinData[key].values[seq];
                    } else if (parseInt(seq) >= 800001) {
                        value = vinData[key].values['800001'];
                    } else if (parseInt(seq) >= 700001) {
                        value = vinData[key].values['700001'];
                    } else if (parseInt(seq) >= 100001) {
                        value = vinData[key].values['100001'];
                    }
                    addResult(description, `${seq} (${value})`);
                } else if (key === '6') {
                    const char = vin.substring(5, 6);
                    value = vinData[key].values[char] || 'Unknown';
                    addResult(description, value);
                } else {
                    const char = vin[parseInt(key) - 1];
                    value = vinData[key].values[char] || 'Unknown';
                    addResult(description, value);
                }
            });
        }

        function decodeRpos() {
            if (selectedRpos.size === 0) {
                const li = document.createElement('li');
                li.className = 'text-gray-400 p-2';
                li.textContent = 'No RPO codes were entered.';
                rpoResultsUl.appendChild(li);
                return;
            }
            selectedRpos.forEach(code => {
                const description = rpoData[code] || 'Description not found';
                const li = document.createElement('li');
                li.className = 'p-4 bg-black rounded-md shadow-inner transition-all hover:bg-neutral-800';
                li.innerHTML = `<span class="font-normal text-secondary">${code}:</span> <strong class="text-primary">${description}</strong>`;
                rpoResultsUl.appendChild(li);
                rpoBreakdown[code] = description;
            });
        }

        function calculateMSRP() {
            let totalMSRP = 28949; // Base MSRP
            
            // Commented-out conditional for changing base price
            // if (selectedRpos.has("ZR1")) {
            //     totalMSRP = 58995;
            // }

            // Commented-out conditional for changing base price
            const zr1Codes = ["ZR1", "10T", "11T", "16T", "19T", "22T", "34T", "41T", "67T", "68T", "C05", "E45", "V56"];
            const hasSpecialRPO = zr1Codes.some(code => selectedRpos.has(code));

            if (hasSpecialRPO) {
                totalMSRP = 34122;
            }

            for (const rpo of selectedRpos) {
                if (rpoPrices[rpo]) {
                    totalMSRP += rpoPrices[rpo];
                }
            }
            
            msrpValue.textContent = `$${totalMSRP.toLocaleString()}`;
        }

        // --- Copy to Clipboard Logic ---
        copyRpoBtn.addEventListener('click', async () => {
            const translations = Object.values(rpoBreakdown);
            if (translations.length === 0) {
                alert("No RPO codes to copy.");
                return;
            }
            const textToCopy = translations.join(', ');
            try {
                await navigator.clipboard.writeText(textToCopy);
                copyRpoBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyRpoBtn.textContent = 'Copy';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy. Please try again or copy manually.');
            }
        });

        // --- CSV Export Logic ---
        exportCsvBtn.addEventListener('click', () => {
            let csvContent = "";
            
            // Add VIN Breakdown
            csvContent += "VIN Breakdown\n";
            for (const key in vinBreakdown) {
                csvContent += `"${key}","${vinBreakdown[key]}"\n`;
            }
            csvContent += "\n";

            // Add RPO Breakdown
            csvContent += "RPO Codes\n";
            for (const key in rpoBreakdown) {
                csvContent += `"${key}","${rpoBreakdown[key]}"\n`;
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "corvette_data.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
